<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Grind</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f0f0f;
  color: #ffffff;
}

header {
  padding: 20px;
  text-align: center;
  font-size: 26px;
  font-weight: bold;
}

.card {
  background: #1c1c1c;
  margin: 14px;
  padding: 16px;
  border-radius: 18px;
}

button {
  background: #ffffff;
  color: #000;
  border: none;
  padding: 12px 18px;
  border-radius: 12px;
  font-weight: bold;
  font-size: 15px;
}

.small {
  font-size: 13px;
  opacity: 0.7;
}
</style>
</head>

<body>

<header>Daily Grind</header>

<div class="card">
  <b>Antrenamentul de azi</b>
  <p class="small">Fa ceva azi, chiar daca nu ai chef.</p>
  <button onclick="completeWorkout()">Antrenament finalizat</button>
</div>

<div class="card">
  <b>Streak</b>
  <p id="streak">0 zile consecutive</p>
</div>

<div class="card">
  <b>Motivatie</b>
  <p id="motivation"></p>
</div>

<div class="card">
  <b>Nutritie rapida</b>
  <ul class="small">
    <li>Proteine: 1.6–2g/kg corp</li>
    <li>Carbohidrati complecsi</li>
    <li>Grasimi sanatoase</li>
    <li>2–3L apa / zi</li>
    <li>Surplus caloric constant</li>
  </ul>
</div>

<script>
const messages = [
  "Disciplina bate motivatia",
  "Daily Grind nu se sare",
  "Fii mai bun decat ieri",
  "Corpul tau este investitia ta",
  "Un antrenament mic e mai bun decat zero"
];

document.getElementById("motivation").innerText =
  messages[Math.floor(Math.random() * messages.length)];

let streak = localStorage.getItem("streak") || 0;
document.getElementById("streak").innerText = streak + " zile consecutive";

function completeWorkout() {
  streak++;
  localStorage.setItem("streak", streak);
  document.getElementById("streak").innerText = streak + " zile consecutive";
  alert("Bravo! Streak +1");
}

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js");
}
</script>

</body>
</html>
