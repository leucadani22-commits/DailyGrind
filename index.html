<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Grind</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">

<style>
:root {
  --bg: #0f0f0f;
  --card: #1c1c1c;
  --text: #ffffff;
}

.light {
  --bg: #f5f5f5;
  --card: #ffffff;
  --text: #000000;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
}

header {
  padding: 20px;
  text-align: center;
  font-size: 26px;
  font-weight: bold;
}

.card {
  background: var(--card);
  margin: 14px;
  padding: 16px;
  border-radius: 18px;
}

button {
  background: var(--text);
  color: var(--bg);
  border: none;
  padding: 12px 18px;
  border-radius: 12px;
  font-weight: bold;
}
.toggle {
  position: fixed;
  top: 16px;
  right: 16px;
  font-size: 20px;
  cursor: pointer;
}
</style>
</head>

<body>

<header>Daily Grind</header>

<div class="toggle" onclick="toggleTheme()">🌙</div>

<div class="card">
  <b>Antrenamentul de azi</b>
  <div id="workoutDetails"></div>
</div>

<div class="card">
  <b>Timer pauza</b>
  <p id="timer">60 sec</p>
  <button onclick="startTimer()">Porneste</button>
</div>

<div class="card">
  <b>Antrenamentul zilei</b>
  <p id="dayWorkout"></p>
</div>

<div class="card">
  <b>Obiectiv greutate</b>
  <input type="number" id="weight" placeholder="Greutate actuala">
  <button onclick="saveWeight()">Salveaza</button>
  <p id="progress"></p>
</div>

<div class="card">
  <b>Streak</b>
  <p id="streak">0 zile consecutive</p>
  <button onclick="resetStreak()">Reset streak</button>
</div>

<div class="card">
  <b>Motivatie</b>
  <p id="motivation"></p>
</div>

<div class="card">
  <b>Nutritie rapida</b>
  <ul class="small">
    <li>Proteine: 1.6–2g/kg corp</li>
    <li>Carbohidrati complecsi</li>
    <li>Grasimi sanatoase</li>
    <li>2–3L apa / zi</li>
    <li>Surplus caloric constant</li>
  </ul>
</div>

<script>
const messages = [
  "Disciplina bate motivatia",
  "Daily Grind nu se sare",
  "Fii mai bun decat ieri",
  "Corpul tau este investitia ta",
  "Un antrenament mic e mai bun decat zero"
];

document.getElementById("motivation").innerText =
  messages[Math.floor(Math.random() * messages.length)];

let streak = localStorage.getItem("streak") || 0;
document.getElementById("streak").innerText = streak + " zile consecutive";

function completeWorkout() {
  streak++;
  localStorage.setItem("streak", streak);
  document.getElementById("streak").innerText = streak + " zile consecutive";
  alert("Bravo! Streak +1");
}

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js");
}

function toggleTheme() {
  document.body.classList.toggle("light");
  localStorage.setItem("theme", document.body.className);
}
 
function resetStreak() {
  if (confirm("Sigur vrei sa resetezi streak-ul?")) {
    localStorage.removeItem("streak");
    localStorage.removeItem("lastStreakDate");
    document.getElementById("streakText").innerText = "0 zile";
  }
}

document.body.className = localStorage.getItem("theme") || "";

let time = 60;
let interval;

function startTimer() {
  clearInterval(interval);
  time = 60;
  document.getElementById("timer").innerText = time + " sec";
  interval = setInterval(() => {
    time--;
    document.getElementById("timer").innerText = time + " sec";
    if (time <= 0) clearInterval(interval);
  }, 1000);
}

const workouts = [
  "Ziua 1 – Piept + Triceps",
  "Ziua 2 – Spate + Biceps",
  "Ziua 3 – Picioare",
  "Ziua 4 – Cardio + Core",
  "Ziua 5 – Umeri",
  "Ziua 6 – Full Body",
  "Ziua 7 – Recuperare"
];

const day = new Date().getDay();
document.getElementById("dayWorkout").innerText =
  workouts[day === 0 ? 6 : day - 1];

function saveWeight() {
  const w = document.getElementById("weight").value;
  localStorage.setItem("weight", w);
  document.getElementById("progress").innerText =
    "Progres: " + w + " / 80 kg";
}

const savedWeight = localStorage.getItem("weight");
if (savedWeight) {
  document.getElementById("progress").innerText =
    "Progres: " + savedWeight + " / 80 kg";
}

const workouts = [
  {
    day: "Ziua 1 – Piept + Triceps + Abdomen",
    exercises: [
      "Flotari – 4 x 15-20",
      "Diamond push-ups – 3 x 10-12",
      "Decline push-ups – 4 x 12-15",
      "Dips intre doua scaune – 3 x 10-12",
      "Triceps dips pe banca/scaun – 3 x 12-15",
      "Abdomene – 3 x 20",
      "Russian twists – 3 x 20 / parte"
    ]
  },
  {
    day: "Ziua 2 – Spate + Biceps + Abdomen",
    exercises: [
      "Tractiuni – 4 x 6-10",
      "Inverted rows – 4 x 10-12",
      "Superman – 3 x 15-20",
      "Biceps curls cu banda – 4 x 12",
      "Hammer curls – 4 x 12",
      "Leg raises – 3 x 12-15",
      "Plank cu ridicare brat – 3 x 30 sec / parte"
    ]
  },
  {
    day: "Ziua 3 – Picioare + Fese",
    exercises: [
      "Genuflexiuni – 4 x 15-20",
      "Fandari – 4 x 12 / picior",
      "Bulgarian split squats – 3 x 12 / picior",
      "Glute bridges – 4 x 15-20",
      "Squat jumps – 3 x 12",
      "Calf raises – 4 x 20",
      "Lateral leg raises – 3 x 12 / parte"
    ]
  },
  {
    day: "Ziua 4 – Cardio + Core",
    exercises: [
      "Cardio – 30-40 minute",
      "Bicycle crunches – 4 x 20",
      "Leg raises – 4 x 12-15",
      "Plank – 3 x 30-60 sec",
      "Russian twists – 3 x 20 / parte",
      "Mountain climbers – 3 x 30 sec"
    ]
  },
  {
    day: "Ziua 5 – Umeri + Core + Cardio",
    exercises: [
      "Shoulder press – 4 x 12",
      "Pike push-ups – 3 x 12-15",
      "Lateral raises – 4 x 12",
      "Front raises – 4 x 12",
      "Plank cu ridicare brat – 3 x 30 sec / parte",
      "Jumping jacks – 3 x 30 sec",
      "Burpees – 3 x 12"
    ]
  },
  {
    day: "Ziua 6 – Full Body + Cardio Intensiv",
    exercises: [
      "Burpees – 4 x 12-15",
      "Jump squats – 4 x 12",
      "Push-ups cu rotatie – 3 x 10-12",
      "Mountain climbers – 4 x 30 sec",
      "Lunges cu saritura – 3 x 12 / picior",
      "Jumping jacks – 3 x 30 sec",
      "Plank cu ridicare picior – 3 x 30 sec / parte"
    ]
  },
  {
    day: "Ziua 7 – Recuperare activa + Stretching",
    exercises: [
      "Plimbare activa sau yoga – 30-40 minute",
      "Stretching complet – 15-20 minute",
      "Respiratie profunda si relaxare – 10 minute"
    ]
  }
];

const today = new Date().getDay();
const workoutIndex = today === 0 ? 6 : today - 1;
const todayWorkout = workouts[workoutIndex];

let html = `<p><b>${todayWorkout.day}</b></p><ul>`;
todayWorkout.exercises.forEach(ex => {
  html += `<li>${ex}</li>`;
});
html += "</ul>";

document.getElementById("workoutDetails").innerHTML = html;

</script>

</body>
</html>
